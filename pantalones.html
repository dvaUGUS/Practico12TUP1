<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Estilo UTN - Pantalones y Calzado</title>
    <link rel="stylesheet" href="pantalones.css">
    <link rel="icon" href="assets/icon/icon.png">

</head>
<body>
    <header>
        <a href="index.html" style="text-decoration: none;color: black;">
            <h1><i>Estilo UTN</i></h1></a>
    </header>

    <nav>
        <button id="menu">☰</button>
        <div id="enlaces">
        <a href="index.html" >Inicio</a>
        <a href="buzos.html" >Buzos y camperas</a>
        <a href="pantalones.html">Pantalones y calzado</a>
        <a href="carrito.html">Carrito (<span id="cart_counter">0</span>)</a>
        </div>
    </nav>

    <main class="contenedor">
        <section class="seccion_principal">
            <h2>Colección de Pantalones y Calzado</h2>
            <p>El estilo perfecto para cada ocasión.</p>
        </section>

        <div class="barra_filtros">
            <div class="grupo_filtro">
                <label for="filter-category">Categoría:</label>
                <select id="filter-category">
                    <option value="all">Todos los productos</option>
                    <option value="pantalones">Pantalones</option>
                    <option value="calzado">Calzado</option>
                </select>
            </div>
            <div class="grupo_filtro">
                <label for="sort-price">Ordenar por:</label>
                <select id="sort-price">
                    <option value="low">Menor precio</option>
                    <option value="high">Mayor precio</option>
                </select>
            </div>
        </div>
        <div>
            <h3 class="titulo_seccion">Pantalones</h3>
            <section class="grilla_productos" id="pantalones">
            </section>
        </div>

        <div>            
            <h3 class="titulo_seccion">Calzado</h3>
            <section class="grilla_productos" id="calzado">
            </section>
        </div>

    </main>
    <footer> Grupo de Augusto De Vuono, Matias Barrios, Julieta Pereyra y Lucio Caturegli</footer>
    <script src="script.js"></script>\
    <script src="pantalones.js"></script>
</body>
</html>
